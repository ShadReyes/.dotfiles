query Issue($id: String!) {
  issue(id: $id) {
    id
    identifier
    title
    description
    priority
    url
    createdAt
    updatedAt
    team { id key name }
    state { id name type }
    assignee { id name }
    project { id name }
    labels { nodes { id name } }
    parent {
      id
      identifier
      title
      url
      state { id name type }
      project { id name }
    }
    children {
      nodes {
        id
        identifier
        title
        url
        state { id name type }
        project { id name }
      }
    }
    relations {
      nodes {
        type
        relatedIssue {
          id
          identifier
          title
          url
          state { id name type }
          project { id name }
        }
      }
    }
  }
}
